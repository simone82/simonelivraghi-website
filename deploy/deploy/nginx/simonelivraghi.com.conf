# file: /etc/nginx/sites-available/simonelivraghi.com
# Canonical site: www.simonelivraghi.com
server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    http2 on;
    server_name www.simonelivraghi.com;

    ssl_certificate /etc/letsencrypt/live/simonelivraghi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/simonelivraghi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/simonelivraghi.com;
    index index.html;

    # Serve the precompressed .gz files produced by the Vite build
    gzip_static on;

    # Hashed build assets: cache forever
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML entry point: always revalidate so new deploys are picked up
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vue Router history mode: unknown paths fall back to the SPA
    location / {
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

# Bare domain over HTTPS: redirect to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name simonelivraghi.com;

    ssl_certificate /etc/letsencrypt/live/simonelivraghi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simonelivraghi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.simonelivraghi.com$request_uri;
}

# Plain HTTP: redirect everything straight to the canonical HTTPS URL
server {
    listen 80;
    listen [::]:80;
    server_name simonelivraghi.com www.simonelivraghi.com;

    return 301 https://www.simonelivraghi.com$request_uri;
}
